<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HaiRong Chen - Personal Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 480px;
      width: 100%;
      padding: 40px 36px;
      text-align: center;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: #fff;
      font-weight: 500;
    }
    h1 {
      font-size: 24px;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .title {
      font-size: 14px;
      color: #764ba2;
      margin-bottom: 16px;
    }
    .bio {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tag {
      padding: 4px 12px;
      background: #f0edff;
      color: #534ab7;
      border-radius: 20px;
      font-size: 12px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      font-size: 14px;
      transition: all 0.2s;
    }
    .link:hover {
      border-color: #764ba2;
      color: #764ba2;
      background: #faf8ff;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">H</div>
    <h1>HaiRong Chen</h1>
    <p class="title">Quantitative Developer &amp; AI Explorer</p>
    <p class="bio">
      Focusing on automated trading systems (MT4/MT5) and AI-driven market analysis.
      Building intelligent tools for financial data insights.
    </p>
    <div class="tags">
      <span class="tag">MQL4 / MQL5</span>
      <span class="tag">Quantitative Trading</span>
      <span class="tag">Python</span>
      <span class="tag">AI Applications</span>
      <span class="tag">Data Analysis</span>
    </div>
    <div class="links">
      <a class="link" href="https://github.com/Roke111" target="_blank">GitHub</a>
      <a class="link" href="mailto:chenhairong@email.com">Email</a>
    </div>
    <p class="footer">Powered by GitHub Pages</p>
  </div>
</body>
</html>
